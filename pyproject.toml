[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drissionpage-cli"
version = "0.1.6"
description = "DrissionPage CLI - Token-efficient browser automation for coding agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "DrissionPage-MCP Contributors"}
]
keywords = ["browser", "automation", "cli", "drissionpage", "web", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "DrissionPage>=4.0.0",
]

[project.scripts]
drissionpage-cli = "drissionpage_cli:main"

[project.urls]
Homepage = "https://github.com/nicekate/DrissionPage-MCP"
Repository = "https://github.com/nicekate/DrissionPage-MCP"

[tool.setuptools.packages.find]
include = ["drissionpage_cli*"]

[tool.setuptools.package-data]
drissionpage_cli = ["skills/**/*"]
